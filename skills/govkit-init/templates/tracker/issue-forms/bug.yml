name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what you saw. Paste errors or screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: where
    attributes:
      label: Where
      description: Page, environment, version or device.
  - type: markdown
    attributes:
      value: |
        A maintainer adds the launch-category label when triaging. Until then this issue counts as "to triage".
