# govkit's own CI: the plugin's manifests, its scripts, and its tests.
# Actions minutes are free on public repos, so every step runs on every PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade tests build fixtures from past releases (git show v0.5.0:…), so they need tags.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check every script
        run: |
          find . -name '*.mjs' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Tests
        run: node --test "tests/*.test.mjs"

      - name: Validate the plugin and the marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/marketplace.json
