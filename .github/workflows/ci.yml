# govkit's own CI: the plugin's manifests, its scripts, and its tests.
# Actions minutes are free on public repos, so every step runs on every PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The upgrade tests build fixtures from past releases (git show v0.5.0:…), so they need tags.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax-check every script
        run: |
          find . -name '*.mjs' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Tests
        run: npm test

      - name: govkit's own guardrails are all installed
        run: npm run govkit:doctor -- --ci

      # PRs only: the tag for main's version is created after the merge, so on the push to main
      # it cannot exist yet. A forgotten tag fails the next PR instead.
      - name: Release check
        run: npm run release:check -- ${{ github.event_name == 'pull_request' && '--pr' || '' }}

      # Pinned: this is a required check, and must not break because Claude Code released.
      # Raise the pin deliberately, in its own PR.
      - name: Validate the plugin and the marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code@2.1.312 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.312 plugin validate .claude-plugin/marketplace.json
