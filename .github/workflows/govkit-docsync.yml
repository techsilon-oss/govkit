name: sdlc-docs
# Renamed in govkit 0.8.0 (it was the sdlc-docs workflow file). The workflow name, the job name ("Doc-sync (gate|warn)")
# and the PR-comment marker keep their old names on purpose: a repo may require the job as a status
# check, and renaming it would leave every PR waiting for a check that never reports.

# Documentation Sync Watchdog (CLAUDE.md §Doc-Sync Mechanism). Replaces the earlier
# doc-sync.yml. Runner: scripts/govkit-docsync.mjs (dependency-free Node — no install needed).
#   • PR to dev  → --warn  (comments, never blocks)
#   • PR to main → --gate  (comments AND fails on gating drift)
# Registry: scripts/source-doc-map.json. Override a gate with /skip-doc-sync isn't used here —
# instead justify in the PR body and update the mapped doc, or downgrade the mapping to "warn".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  doc-sync:
    name: Doc-sync (${{ github.base_ref == 'main' && 'gate' || 'warn' }})
    runs-on: ubuntu-latest
    steps:
      # v5+ of checkout and setup-node run on Node 24: a self-hosted runner must be v2.327.1 or later.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run doc-sync audit
        id: audit
        run: |
          BASE="${{ github.base_ref }}"
          MODE=$([ "$BASE" = "main" ] && echo gate || echo warn)
          git fetch --no-tags --depth=100 origin "$BASE"
          # The runner is scripts/govkit-docsync.mjs unless govkit.json `paths` puts it elsewhere.
          RUNNER=$(node -e 'let p; try { p = require("./govkit.json").paths?.["scripts/govkit-docsync.mjs"] } catch {} process.stdout.write(p || "scripts/govkit-docsync.mjs")')
          set +e
          node "$RUNNER" audit --$MODE --base "origin/$BASE" | tee /tmp/sdlc-docs.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Always: the findings in the job summary, which every PR can show, a fork's included.
      - name: Write findings to the job summary
        if: always()
        run: |
          {
            echo "### Doc-sync (${{ steps.audit.outputs.mode }} mode)"
            echo '```'
            cat /tmp/sdlc-docs.txt 2>/dev/null || echo "(the audit wrote no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Not on a PR from a fork: its token is read-only, so writing the comment would fail the run.
      # The gate below still applies to forks.
      - name: Comment findings on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const MARKER = "<!-- sdlc-docs-bot -->";
            const body = fs.readFileSync("/tmp/sdlc-docs.txt", "utf-8").trim();
            const mode = "${{ steps.audit.outputs.mode }}";
            const clean = /No drift detected|nothing to check/.test(body);
            const msg = [
              MARKER,
              `### 🧾 sdlc-docs (${mode} mode)`,
              clean ? "✅ No code→doc drift detected." : "",
              clean ? "" : "```\n" + body.slice(0, 60000) + "\n```",
              clean ? "" : mode === "gate"
                ? "**Gating** findings block merge to `main`. Update the mapped doc(s) in this PR."
                : "Warnings don't block — but gating rules will at the PR-to-main gate.",
            ].filter(Boolean).join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            })).find((c) => (c.body || "").includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: msg });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: msg });
            }

      - name: Enforce gate
        if: steps.audit.outputs.mode == 'gate' && steps.audit.outputs.exit != '0'
        run: |
          echo "❌ Doc-sync gate failed — mapped docs missing for changed code. See the PR comment."
          exit 1
